# URL PUBLIQUE DU BACKEND (et non celle du front Netlify) : sert a fabriquer les liens /uploads/...
app.public-base-url=${PUBLIC_BASE_URL:https://kamel-backend-2.onrender.com}

spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://HoussemEllouze:HoussemEllouze@cluster0.scwazqt.mongodb.net/kamel?retryWrites=true&w=majority&appName=Cluster0}

app.cors.allowed-origins=${CORS_ORIGINS:https://3am-kamel.netlify.app,https://kamel-front-admin.vercel.app}

# --- Cle pour lire les commandes (header X-Admin-Key). Vide = routes admin desactivees ---
app.admin-key=${ADMIN_KEY:}

server.port=${PORT:9000}

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB


server.error.include-message=always

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.packages-to-scan=tn.kamel.backend.web