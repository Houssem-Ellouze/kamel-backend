# --- MongoDB Atlas ---
# En local : remplacez VOTRE_MOT_DE_PASSE (sans les < >).
# En production : definissez la variable d'environnement MONGODB_URI, elle remplace cette valeur.
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://HoussemEllouze:HoussemEllouze@cluster0.scwazqt.mongodb.net/kamel?retryWrites=true&w=majority&appName=Cluster0}

# --- CORS : origines autorisees a appeler l'API (le front Netlify) ---
app.cors.allowed-origins=${CORS_ORIGINS:https://3am-kamel.netlify.app,http://localhost:5500,http://127.0.0.1:5500}

# --- Cle pour lire les commandes (header X-Admin-Key). Vide = routes admin desactivees ---
